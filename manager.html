function customLabel(g,i){var def=CUSTOM_DEFS[i];if(!def)return '';var v=getCustomValue(g,i);if(def.type==='choice'){var c=def.choices[v]||def.choices[0];return def.ibada+': '+c.label+' = '+c.pts+' نقطة';}return def.ibada+': '+v+' '+def.unit;}

async function loadData(){

function girlCard(g,gi,sorted,maxG){

  const dots=dt.map((v,i)=>'<div class="dd '+(v>0?'f':'e')+'"><div class="dn">'+(i+1)+'</div>'+(v>0?v:'')+'</div>').join('');
  const chips=CUSTOM_DEFS.map((_,i)=>'<span class="chip">'+esc(customLabel(g,i))+'</span>').join('');
  return '<div class="girl-card"><div class="gc-hdr"><div class="gc-name">'+medal+' '+esc(g.name)+'</div><div class="gc-pts">'+g.grand+' نقطة | معدل '+g.avg+'</div></div><div class="gc-body"><div class="custom-box"><div class="custom-title">⚙️ اختيارات وكميات البنت</div><div class="chips">'+chips+'</div></div><div class="prog-row"><span>التقدم الكلي</span><span>'+pct+'%</span></div><div class="prog-t"><div class="prog-f" style="width:'+pct+'%"></div></div><div class="days-row">'+dots+'</div><button class="toggle-btn" onclick="toggleDetails('+gi+',this)">▼ عرض تفاصيل العبادات</button><div class="details" id="details_'+gi+'">'+detailsTable(g)+amalHtml(g)+duaaHtml(g)+notesHtml(g)+'<div style="font-size:10px;color:var(--mu);margin-top:8px;text-align:left">آخر إرسال: '+esc(g.lastUpdate||'—')+'</div></div></div></div>';
}
function detailsTable(g){
  let html='<div class="detail-table-wrap"><table class="detail-table"><thead><tr><th>الفئة</th><th>العبادة</th><th>نقاطها حسب اختيارها</th>';for(let d=1;d<=DAYS;d++)html+='<th>'+d+'</th>';html+='<th>المجموع</th></tr></thead><tbody>';
  let lastCat='', catRows={};ROWS.forEach(r=>catRows[r.cat]=(catRows[r.cat]||0)+1);
  ROWS.forEach((r,ri)=>{const pts=rowPts(g,r);let earned=0;html+='<tr>';if(r.cat!==lastCat){html+='<td class="cat" rowspan="'+catRows[r.cat]+'">'+esc(r.cat)+'</td>';lastCat=r.cat;}html+='<td class="ibada">'+esc(rowName(g,r))+(r.badil?'<div style="font-size:8px;color:#b8860b;font-weight:400">🔄 '+esc(r.badil)+'</div>':'')+'</td><td>'+pts+'</td>';for(let d=1;d<=DAYS;d++){const v=(g.state&&g.state[sk(ri,d)])||0;if(v===1)earned+=pts;html+='<td><span class="id '+(v===1?'d':v===2?'m':'e')+'">'+(v===1?'✓':v===2?'✗':'')+'</span></td>';}html+='<td><b>'+earned+'</b></td></tr>';});
  html+='</tbody></table></div>';return html;
}
function amalHtml(g){
  const amal=g.amal||{};let count=0;Object.keys(amal).forEach(k=>{if(amal[k])count++;});let html='<div class="custom-box" style="margin-top:10px"><div class="custom-title">🌟 الأعمال الصالحة ('+count+'/'+AMAL.length+')</div><div class="amal-list">';
  AMAL.forEach((a,i)=>{html+='<span class="'+(amal[i]?'amal-ok':'amal-no')+'">'+(amal[i]?'✓ ':'')+esc(a.name)+' — '+a.pts+'</span>';});
  return html+'</div></div>';
}
function duaaHtml(g){
  const duaa=g.duaa||{};let count=0;Object.keys(duaa).forEach(k=>{if(duaa[k])count++;});let html='<div class="custom-box" style="margin-top:10px"><div class="custom-title">🤲 خانة الدعاء ('+count+'/30)</div>';
  for(let d=1;d<=DAYS;d++){let any=DUAA_ITEMS.some(it=>duaa[d+'-'+it.key]);if(!any)continue;html+='<div class="duaa-day"><div class="duaa-title">اليوم '+d+'</div><div class="duaa-text">'+esc(DUAAS[d-1]||'')+'</div><div class="duaa-list">';DUAA_ITEMS.forEach(it=>{html+='<span class="'+(duaa[d+'-'+it.key]?'amal-ok':'amal-no')+'">'+(duaa[d+'-'+it.key]?'✓ ':'')+esc(it.name)+' — ٢</span>';});html+='</div></div>';}
  if(count===0)html+='<div style="font-size:10px;color:#aaa">لا يوجد دعاء محدد بعد</div>';
  return html+'</div>';
}
function notesHtml(g){
  const notes=g.notes||{};const keys=Object.keys(notes);if(!keys.length)return '';
  let html='<div class="custom-box" style="margin-top:10px"><div class="custom-title">📝 ملاحظات الأيام</div>';
  keys.sort((a,b)=>Number(a)-Number(b)).forEach(d=>{html+='<div class="duaa-day"><div class="duaa-title">اليوم '+d+'</div><div class="duaa-text">'+esc(notes[d].text||'')+'</div><div style="font-size:9px;color:#aaa">'+esc(notes[d].time||'')+'</div></div>';});
  return html+'</div>';
}
function toggleDetails(i,btn){const d=document.getElementById('details_'+i);d.classList.toggle('open');btn.textContent=d.classList.contains('open')?'▲ إخفاء تفاصيل العبادات':'▼ عرض تفاصيل العبادات';}
function exportExcel(){
  if(!girlsData.length){showToast('لا يوجد بيانات');return;}
  const wb=XLSX.utils.book_new();const sorted=[...girlsData].sort((a,b)=>b.grand-a.grand);
  const sum=[['الترتيب','الاسم','المجموع','المعدل','الأيام',...Array.from({length:10},(_,i)=>'يوم '+(i+1)),'الكميات والاختيارات','آخر تحديث']];
  sorted.forEach((g,i)=>sum.push([i+1,g.name,g.grand,g.avg,g.filled,...(g.dayTotals||[]),CUSTOM_DEFS.map((_,j)=>customLabel(g,j)).join(' | '),g.lastUpdate||'']));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(sum),'ملخص');
  girlsData.forEach(g=>{const d=[['الفئة','العبادة','النقاط',...Array.from({length:10},(_,i)=>'يوم '+(i+1)),'المجموع']];ROWS.forEach((r,ri)=>{const pts=rowPts(g,r);let s=0;const row=[r.cat,rowName(g,r),pts];for(let day=1;day<=DAYS;day++){const v=((g.state||{})[sk(ri,day)]||0)===1?pts:0;row.push(v);s+=v;}row.push(s);d.push(row);});XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(d),String(g.name).slice(0,28));});
  XLSX.writeFile(wb,'نتائج_البنات_ذي_الحجة.xlsx');showToast('تم التصدير ✓');
}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000);}loadData();
</script>
</body>
</html>
